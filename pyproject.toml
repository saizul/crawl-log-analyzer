[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl-log-analyzer"
version = "0.1.0"
description = "Analyse Nginx/Apache access logs to see how search engine bots really crawl your site."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["seo", "technical-seo", "log-analysis", "googlebot", "crawl-budget", "nginx", "apache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Log Analysis",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    # tomllib joined the standard library in 3.11; config files on 3.10 need tomli.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/saizul/crawl-log-analyzer"
Issues = "https://github.com/saizul/crawl-log-analyzer/issues"
Changelog = "https://github.com/saizul/crawl-log-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
crawl-log-analyzer = "crawl_log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
